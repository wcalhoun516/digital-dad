[project]
name = "digital-dad"
version = "0.1.0"
description = "Scrape, analyze, and visualize Dr. George Calhoun's Forbes articles"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
scrape = [
    "playwright>=1.49",
    "playwright-stealth>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]
analyze = [
    "scikit-learn>=1.5",
    "openai>=1.50",
    "numpy>=1.26",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
finetune = [
    # Geo-LLM QLoRA fine-tune (plan 0008). MLX is Apple-Silicon/macOS only, so the
    # marker makes this a no-op elsewhere (e.g. Linux CI). Opt-in; kept out of `all`.
    "mlx-lm>=0.31; platform_machine == 'arm64'",
]
all = [
    "digital-dad[scrape,analyze,dev]",
]

[tool.setuptools.packages.find]
include = ["scraper*", "analysis*", "viz*", "training*", "ingest*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The source packages carry ~74 pre-existing long lines, and most of them are embedded LLM
# prompt string literals (psychoprofile, predictions, on_this_day). Re-wrapping a prompt
# literal edits the prompt the model actually sees, so that is a deliberate behavior change
# and belongs in its own reviewed pass — not in the change that turned linting on.
# tests/ is deliberately absent: it has been E501-clean since the gate existed and stays gated.
"analysis/*.py" = ["E501"]
"bin/*.py" = ["E501"]
"scraper/*.py" = ["E501"]
"tools/*.py" = ["E501"]
"training/*.py" = ["E501"]
"viz/*.py" = ["E501"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
